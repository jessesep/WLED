# Custom Build Environment for Dario's ESP32 + W5500 SPI Ethernet Board
# --------------------------------------------------------------------------
# Board specs:
#   - ESP32 (classic, VSPI)
#   - W5500 Ethernet controller via SPI
#   - SPI pins: MOSI=23, MISO=19, SCK=18, CS=5, INT=4, RST=N/A (tied high on PCB)
#   - 4x parallel LED outputs: GPIOs 12, 14, 27, 26
#   - LED type: WS2805 (GRBAW) - configurable in WLED UI, not hardcoded
#
# Usage:
#   pio run -e esp32_w5500
#   pio run -e esp32_w5500 -t upload --upload-port /dev/ttyUSB0

[platformio]
default_envs = esp32_w5500

[env:esp32_w5500]
board = esp32dev
platform = ${esp32_idf_V4.platform}
platform_packages = ${esp32_idf_V4.platform_packages}
upload_speed = 921600
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32.build_flags}
  -D WLED_RELEASE_NAME=\"ESP32_W5500\"
  ; -- Ethernet support --
  -D WLED_USE_ETHERNET
  -D WLED_ETH_W5500
  -D WLED_ETH_DEFAULT=14              ; WLED_ETH_W5500_SPI - auto-select at boot
  ; -- W5500 SPI pin configuration (ESP32 VSPI) --
  -D WLED_ETH_W5500_MOSI=23
  -D WLED_ETH_W5500_MISO=19
  -D WLED_ETH_W5500_SCK=18
  -D WLED_ETH_W5500_CS=5
  -D WLED_ETH_W5500_INT=4
  -D WLED_ETH_W5500_RST=-1
  -D WLED_ETH_W5500_SPI_CLOCK_MHZ=25
  ; -- LED outputs (4 parallel) --
  -D DATA_PINS=12,14,27,26
  ; -- General --
  -D BTNPIN=-1                        ; no default button pin
  -D RLYPIN=-1                        ; no relay
  -DARDUINO_USB_CDC_ON_BOOT=0         ; mandatory for classic ESP32 with arduino-esp32 >=2.0.3

; Enable W5500 SPI ethernet driver in ESP-IDF sdkconfig
; The Tasmota platform-espressif32 supports custom_sdkconfig to override
; ESP-IDF Kconfig options at compile time
custom_sdkconfig =
  CONFIG_ETH_SPI_ETHERNET_W5500=y

lib_deps = ${esp32.lib_deps}
board_build.partitions = ${esp32.default_partitions}
board_build.flash_mode = dio
monitor_filters = esp32_exception_decoder
